<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
  <link rel="manifest" href="./manifest.json">
<title>Music Black</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  padding: 22px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 2px;
}

.logo span { color: #a855f7; }

h2 { margin-top: 38px; }

.search {
  width: 100%;
  padding: 15px;
  border: 1px solid #333;
  border-radius: 30px;
  background: #171717;
  color: white;
  font-size: 16px;
}

button {
  background: #a855f7;
  border: none;
  color: white;
  padding: 13px 20px;
  border-radius: 25px;
  font-weight: bold;
  cursor: pointer;
}

.player {
  margin-top: 35px;
  padding: 22px;
  background: #171717;
  border-radius: 22px;
  text-align: center;
}

.cover {
  width: 210px;
  height: 210px;
  margin: auto;
  background: linear-gradient(135deg,#32104d,#111);
  border-radius: 18px;
  display: grid;
  place-items: center;
  font-size: 75px;
}

#songName { margin-top: 22px; }

#songInfo { color: #999; }

audio { width: 100%; margin-top: 20px; }

.library {
  margin-top: 35px;
}

footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #151515;
  display: flex;
  justify-content: space-around;
  padding: 18px 5px;
  color: #bbb;
}

footer span { text-align: center; }

main { padding-bottom: 100px; }
</style>
</head>

<body>

<header>
  <div class="logo">MUSIC <span>BLACK</span></div>
  <span>🎧</span>
</header>

<main>
  <h2>Sua música, seu espaço.</h2>

  <input class="search" id="search"
  placeholder="Pesquisar músicas...">

  <h2>Bem-vindo ao Music Black</h2>
  <p style="color:#999">Sua biblioteca musical começa aqui.</p>

  <div class="player">
    <div class="cover">♫</div>

    <h3 id="songName">Nenhuma música selecionada</h3>
    <p id="songInfo">Escolha uma música do seu celular</p>

    <input type="file" id="file"
accept="audio/*" multiple hidden>

    <button onclick="document.getElementById('file').click()">
      + Adicionar música
    </button>

    <audio id="audio" controls></audio>
    <div style="display:flex; gap:10px; justify-content:center; margin-top:20px;">
  <button onclick="previousSong()">⏮ Anterior</button>
  <button onclick="nextSong()">⏭ Próxima</button>
  <button onclick="shuffleSongs()">🔀 Aleatório</button>
    </div>
  </div>

  <div class="library">
    <h2>Minha biblioteca</h2>
    <p style="color:#999">Suas músicas aparecerão aqui.</p>
    <div id="playlist"></div>
  </div>
</main>
<footer>
  <span onclick="window.scrollTo({top:0,behavior:'smooth'})">
    ⌂<br>Início
  </span>

  <span onclick="document.getElementById('search').focus()">
    ⌕<br>Buscar
  </span>

  <span onclick="document.querySelector('.library').scrollIntoView({behavior:'smooth'})">
    ♫<br>Biblioteca
  </span>
</footer>

<script>
const file = document.getElementById("file");
const audio = document.getElementById("audio");

let songs = [];
let currentIndex = -1;

function playSong(index) {
  if (index < 0 || index >= songs.length) return;

  currentIndex = index;
  audio.src = URL.createObjectURL(songs[index]);
  document.getElementById("songName").textContent =
    songs[index].name.replace(/\.[^/.]+$/, "");
  document.getElementById("songInfo").textContent = "Arquivo local";

  audio.play();
}

file.addEventListener("change", function() {
  const selected = Array.from(this.files);

  selected.forEach(song => songs.push(song));

  const playlist = document.getElementById("playlist");
  playlist.innerHTML = "";

  function renderPlaylist() {
  const playlist = document.getElementById("playlist");
  playlist.innerHTML = "";

  songs.forEach((song, index) => {
    const item = document.createElement("div");
    item.style.display = "flex";
    item.style.justifyContent = "space-between";
    item.style.alignItems = "center";
    item.style.marginBottom = "12px";

    const name = document.createElement("span");
    name.textContent = "♫ " + song.name;
    name.onclick = () => playSong(index);

    const remove = document.createElement("button");
    remove.textContent = "🗑";
    remove.onclick = () => {
      if (currentIndex === index) {
        audio.pause();
        audio.removeAttribute("src");
        currentIndex = -1;
        document.getElementById("songName").textContent =
          "Nenhuma música selecionada";
      } else if (currentIndex > index) {
        currentIndex--;
      }

      songs.splice(index, 1);
      renderPlaylist();
    };

    item.appendChild(name);
    item.appendChild(remove);
    playlist.appendChild(item);
  });
}

renderPlaylist();

  if (currentIndex === -1 && songs.length > 0) {
    playSong(0);
  }

  this.value = "";
});

function nextSong() {
  if (songs.length) playSong((currentIndex + 1) % songs.length);
}

function previousSong() {
  if (songs.length) {
    playSong((currentIndex - 1 + songs.length) % songs.length);
  }
}

function shuffleSongs() {
  if (songs.length) {
    playSong(Math.floor(Math.random() * songs.length));
  }
}

audio.addEventListener("ended", nextSong);
</script>
</body>
</html>
